name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 用 bash 调脚本，不用 ./：从 Windows 提交的文件可能没有可执行位。
      - name: Build
        run: bash build.sh

      # 跑起来才算过。异常会以非 0 退出，直接把 job 干红。
      - name: Run 26.3
        run: bash run.sh 26.3

      - name: Run 1.20.1
        run: bash run.sh 1.20.1

      # 产物：loader/api 的 class + 三个 mod jar + 假游戏 class（run.sh 跑 demo 要用）。
      # 不留太久，玩具仓的构建产物没必要囤着。
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollingwood-build
          path: out/
          retention-days: 14
